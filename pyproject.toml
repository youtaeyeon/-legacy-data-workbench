[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hospital-marketing-mvp"
version = "0.1.1"
description = "Mock-data MVP for hospital marketing knowledge workflows"
requires-python = ">=3.12,<3.15"
dependencies = [
  "openpyxl>=3.1,<4",
  "keyring>=25,<27",
  "httpx>=0.27,<1",
  "PySide6>=6.8,<7",
  "python-docx>=1.1,<2",
  "python-pptx>=1.0,<2",
  "pypdf>=5,<7",
]

[project.scripts]
hospital-marketing = "hospital_marketing.app:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pyinstaller>=6.10,<7",
  "reportlab>=4,<5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"
